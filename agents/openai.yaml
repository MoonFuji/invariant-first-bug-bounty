interface:
  display_name: "Invariant-First Bug Bounty"
  short_description: "Invariant-first, evidence-gated vulnerability research"
  default_prompt: >-
    Use $invariant-first-bug-bounty to investigate one authorized security
    invariant completely, prove and bound any real capability, use campaign
    tracking only when broad coverage is requested, and prepare one exact
    final-reviewed report bundle for my submission check.
